[package]
name = "downex"
version = "0.0.1"
default-run = "downex"
description = "Downex - Independent High-Performance Windows Download Manager"
authors = ["Gaurav Patil"]
edition = "2021"

[lib]
name = "downex_lib"
crate-type = ["rlib"]

[[bin]]
name = "downex"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
governor = "0.8"
sha2 = "0.10"
aes-gcm = "0.10"
futures-util = "0.3"
winreg = "0.52"
urlencoding = "2.1"
minisign-verify = "0.2"
base64 = "0.23.1"

[[bin]]
name = "updater"
path = "src/bin/updater.rs"

[[bin]]
name = "downex_service"
path = "src/bin/service.rs"

[[bin]]
name = "downex_recovery"
path = "src/bin/recovery.rs"

[[bin]]
name = "downex_bridge"
path = "src/bin/bridge.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader"
] }

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = false
