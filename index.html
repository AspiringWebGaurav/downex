<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Downex</title>
    <script>
      try {
        var explicit = localStorage.getItem('downex_theme_explicit');
        if (explicit === 'true' && localStorage.getItem('downex_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}

      // Early synchronous reload & context menu lockdown for production runtime (blocks Ctrl+F5, Ctrl+Shift+R, F5, Ctrl+R before bundle loads)
      try {
        (function() {
          var isDev = false;
          try {
            if (window.location && window.location.port && (window.location.port === '1420' || window.location.port === '5173' || window.location.port === '3000')) {
              if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                isDev = true;
              }
            }
          } catch (e) {}

          // Allow test override ONLY on local dev host (never bypass production WebView lockdown on tauri.localhost)
          var canOverrideDev = false;
          try {
            canOverrideDev = Boolean(
              window.location &&
              (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            );
          } catch (e) {}
          if (typeof window !== 'undefined' && window.__DOWNEX_FORCE_PRODUCTION__ === true) {
            isDev = false;
          }
          if (canOverrideDev && typeof window !== 'undefined' && window.__DOWNEX_FORCE_DEV__ === true) {
            isDev = true;
          }

          if (!isDev) {
            var blockKey = function(e) {
              var key = (e.key || '').toLowerCase();
              var code = e.code || '';
              var keyCode = e.keyCode || (e.which || 0);
              var isCtrlOrMeta = (e.ctrlKey || e.metaKey) && !e.altKey;

              var isF5 = key === 'f5' || code === 'F5' || keyCode === 116;
              var isRefresh = key === 'browserrefresh' || key === 'refresh';
              var isReloadR = isCtrlOrMeta && (key === 'r' || code === 'KeyR' || keyCode === 82);
              var isDevTools = key === 'f12' || code === 'F12' || (isCtrlOrMeta && e.shiftKey && (key === 'i' || key === 'j' || key === 'c' || code === 'KeyI' || code === 'KeyJ' || code === 'KeyC'));
              var isBrowserAction = isCtrlOrMeta && !e.shiftKey && (key === 'p' || key === 's' || key === 'u' || code === 'KeyP' || code === 'KeyS' || code === 'KeyU');
              var isCaretOrFind = key === 'f7' || key === 'f3';
              var isHistoryNav = e.altKey && (key === 'arrowleft' || key === 'arrowright' || code === 'ArrowLeft' || code === 'ArrowRight');

              if (isF5 || isRefresh || isReloadR || isDevTools || isBrowserAction || isCaretOrFind || isHistoryNav) {
                e.preventDefault();
                e.stopPropagation();
                if (typeof e.stopImmediatePropagation === 'function') {
                  e.stopImmediatePropagation();
                }
                return false;
              }
            };

            var blockContext = function(e) {
              var target = e.target;
              var tag = target && target.tagName ? target.tagName.toUpperCase() : '';
              var isEditable = tag === 'INPUT' || tag === 'TEXTAREA' || (target && target.isContentEditable) || (target && typeof target.closest === 'function' && target.closest('[contenteditable="true"]'));
              if (!isEditable) {
                e.preventDefault();
                e.stopPropagation();
                if (typeof e.stopImmediatePropagation === 'function') {
                  e.stopImmediatePropagation();
                }
                return false;
              }
            };

            window.addEventListener('keydown', blockKey, { capture: true, passive: false });
            window.addEventListener('keyup', blockKey, { capture: true, passive: false });
            document.addEventListener('keydown', blockKey, { capture: true, passive: false });
            document.addEventListener('keyup', blockKey, { capture: true, passive: false });
            window.addEventListener('contextmenu', blockContext, { capture: true, passive: false });
            document.addEventListener('contextmenu', blockContext, { capture: true, passive: false });
          }
        })();
      } catch (e) {}
    </script>
  </head>
  <body class="bg-white text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 font-sans antialiased overflow-hidden select-none">
    <div id="root" class="w-screen h-screen overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
